<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/games.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="Images/favicon.ico" rel="icon" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="js/site-nav.js" defer></script>
    <title>Caro Game - Memory Modes</title>
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <a href="#">Intro web</a>
            </div>
            <ul class="links">
                <li><a href="index.html" target="_self">Home</a></li>
                <li><a href="about.html" target="_self">About</a></li>
                <li><a href="gallery.html" target="_self">Gallery</a></li>
                <li><a href="gameSelection.html" target="_self">Game</a></li>
                <li><a href="playlist.html" target="_self">Playlist</a></li>
                <li><a href="contact.html" target="_self">Contact</a></li>
            </ul>
            <a href="#" class="action-button" target="_self">Get Started</a>
            <div class="toggle-button">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
        <div class="dropdown-menu">
            <li><a href="index.html" target="_self">Home</a></li>
            <li><a href="about.html" target="_self">About</a></li>
            <li><a href="gallery.html" target="_self">Gallery</a></li>
            <li><a href="gameSelection.html" target="_self">Game</a></li>
            <li><a href="playlist.html" target="_self">Playlist</a></li>
            <li><a href="contact.html" target="_self">Contact</a></li>
            <a href="#" class="action-button" target="_self">Get Started</a>
        </div>
    </header>

    <main class="page-content">
        <div class="info-block">
            <h3>Player Setup</h3>
            <label class="caro-label" for="playerXInput">Player X Username:</label>
            <input class="caro-input" type="text" id="playerXInput" placeholder="e.g. Alice" />
            <label class="caro-label" for="playerOInput">Player O Username:</label>
            <input class="caro-input" type="text" id="playerOInput" placeholder="e.g. Bob" />
        </div>

        <div class="info-block is-hidden" id="playerStats">
            <h3>Players</h3>
            <p id="playerXInfo">Player X: </p>
            <p id="playerOInfo">Player O: </p>
        </div>

        <div class="info-block">
            <h2>Caro Game (Tic-Tac-Toe)</h2>
            <div class="caro-settings">
                <label class="caro-label" for="boardSize">Board size:</label>
                <select class="caro-select" id="boardSize">
                    <option value="3">3 x 3</option>
                    <option value="4">4 x 4</option>
                    <option value="5">5 x 5</option>
                    <option value="6">6 x 6</option>
                    <option value="7">7 x 7</option>
                    <option value="8">8 x 8</option>
                    <option value="9">9 x 9</option>
                    <option value="10">10 x 10</option>
                </select>

                <label class="caro-label caro-label-spaced" for="memoryModeSelect">Memory Mode:</label>
                <select class="caro-select" id="memoryModeSelect">
                    <option value="none">Off</option>
                    <option value="static">Static</option>
                    <option value="dynamic">Dynamic</option>
                    <option value="randomcancel">Random Cancel</option>
                </select>

                <label class="caro-label caro-label-spaced" for="gameModeSelect">Game Mode:</label>
                <select class="caro-select" id="gameModeSelect">
                    <option value="pvp">Player vs Player</option>
                    <option value="pve">Player vs Machine</option>
                </select>

                <button class="size-button" type="button" data-start-caro>Start Game</button>
            </div>

            <div id="caroBoard" class="caro-board"></div>
            <div class="status-text" id="statusText">Player X's Turn</div>
            <button class="restart-button" type="button" data-start-caro>Restart</button>
        </div>
    </main>

    <script type="module" src="js/caro-game.js"></script>
</body>

</html>
